<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3c96f"/>
      <stop offset="0.5" stop-color="#cac16b"/>
      <stop offset="1" stop-color="#a68141"/>
    </linearGradient>
    <linearGradient id="parapet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3c96f"/>
      <stop offset="0.5" stop-color="#cac16b"/>
      <stop offset="1" stop-color="#bfa44b"/>
    </linearGradient>
  </defs>

  <!-- tapered (battered) tower body, wider at the base -->
  <path d="M17 24 L47 24 L51 58 L13 58 Z" fill="url(#sand)"/>

  <!-- shadow cast by the overhanging parapet -->
  <rect x="15" y="24" width="34" height="3" fill="#a17d3f" opacity="0.45"/>

  <!-- overhanging parapet band -->
  <rect x="11" y="17" width="42" height="8" rx="1.5" fill="url(#parapet)"/>
  <rect x="11" y="23" width="42" height="2" fill="#a17d3f" opacity="0.4"/>

  <!-- crenellations (merlons) -->
  <rect x="11" y="11" width="6" height="7" fill="url(#parapet)"/>
  <rect x="20" y="11" width="6" height="7" fill="url(#parapet)"/>
  <rect x="29" y="11" width="6" height="7" fill="url(#parapet)"/>
  <rect x="38" y="11" width="6" height="7" fill="url(#parapet)"/>
  <rect x="47" y="11" width="6" height="7" fill="url(#parapet)"/>

  <!-- flag on the center merlon -->
  <rect x="31.4" y="2" width="1.2" height="10" fill="#744e3d"/>
  <polygon points="32.6,2.5 41,4.5 32.6,7.5" fill="#c0392b"/>

  <!-- flag on the merlon left of center -->
  <rect x="22.4" y="2" width="1.2" height="10" fill="#744e3d"/>
  <polygon points="23.6,2.5 32,4.5 23.6,7.5" fill="#c0392b"/>

  <!-- flag on the merlon right of center -->
  <rect x="40.4" y="2" width="1.2" height="10" fill="#744e3d"/>
  <polygon points="41.6,2.5 50,4.5 41.6,7.5" fill="#c0392b"/>

  <!-- arched window -->
  <path d="M27 48 L27 38 Q32 33 37 38 L37 48 Z" fill="#6c4839"/>
  <path d="M28.5 47 L28.5 39 Q32 35.5 35.5 39 L35.5 47 Z" fill="#744e3d"/>

  <!-- base shadow -->
  <ellipse cx="32" cy="58" rx="22" ry="3" fill="#a17d3f" opacity="0.35"/>
</svg>
